server:
  port: 8081
  tomcat:
    threads:
      max: 200
      min-spare: 50
      max-queue-size: 1000
    connection-timeout: 30000
    accept-count: 100
    max-connections: 10000
spring:
  jvm:
    options: -Djava.net.preferIPv4Stack=true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
      enabled: true
  application:
    name: knockfish-blog-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    url: jdbc:mysql://localhost:3306/knockfish_blog?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowMultiQueries=true&useServerPrepStmts=true&cachePrepStmts=true&prepStmtCacheSize=256&prepStmtCacheSqlLimit=2048
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1800000
      connection-test-query: SELECT 1
      pool-name: KnockfishHikariCP
      leak-detection-threshold: 60000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 5000
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 5000
jwt:
  private-key: classpath:private_key.pem
  public-key: classpath:public_key.pem
  expiration: 360000000
mybatis:
  mapper-locations: classpath:repository/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
    cache-enabled: true
    default-enum-type-handler: com.knockfish.handler.UniversalEnumTypeHandler
  type-aliases-package: com.knockfish.entity, com.knockfish.vo
upload:
  dir:
    avatar: avatar/
    cover: cover/
    article: article/
    note: note/
    background: background/

cloud:
  aws:
    s3:
      endpoint: https://57e3baed33f3640a31710eb39ff795ff.r2.cloudflarestorage.com
      bucket-name: knockfish-blog-storage
      cdn-domain: https://fishbarn.cn
      region: auto
      credentials:
        access-key: ${R2_ACCESS_KEY:}
        secret-key: ${R2_SECRET_KEY:}
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    config-url: /v3/api-docs/swagger-config
    urls:
      - url: /v3/api-docs
        name: API Documentation